version: '3.8'

services:
  backend:
    image: hmi2608/mern-backend:1.0
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb+srv://admin:admin12345@cluster0.a8f6i.mongodb.net/cloud_lab?retryWrites=true&w=majority
      - PORT=5000
      - CORS_ORIGIN=*

  frontend:
    image: hmi2608/mern-frontend:2.0
    ports:
      - "3000:3000"
    depends_on:
      - backend
